name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders; app pages are dynamic and auth is runtime-only.
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
          NEON_AUTH_BASE_URL: https://example.com/auth
          NEON_AUTH_COOKIE_SECRET: ci-cookie-secret-at-least-32-characters-long
          ALLOWED_EMAILS: ci@example.com
