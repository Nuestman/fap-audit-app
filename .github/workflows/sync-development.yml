name: Sync development from main

# After anything lands on main (usually a merged PR from development),
# merge main back into development so development is never left "behind"
# the classic one-ahead / one-behind cycle.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-development-from-main
  cancel-in-progress: false

jobs:
  sync:
    name: Merge main into development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Default token can push to development when it is unprotected.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge origin/main into development
        run: |
          set -euo pipefail
          git fetch origin main development
          git checkout development
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "development already contains main — nothing to sync."
            exit 0
          fi
          if git merge origin/main --no-edit -m "chore: sync main into development after production merge"; then
            git push origin development
            echo "Pushed sync merge to origin/development."
          else
            git merge --abort || true
            echo "::error::Could not auto-merge main into development (conflicts). Checkout development, merge origin/main locally, resolve, and push."
            exit 1
          fi
